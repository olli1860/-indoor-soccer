<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Indoor Soccer 2026 – Team-Ausloser</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="theme-color" content="#111827"><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f3f4f6;color:#111827}main{max-width:720px;margin:auto;padding:18px}h1{font-size:25px;margin:4px 0}.sub{color:#6b7280;margin-bottom:18px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0002}.player{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.player:last-child{border:0}.player input{width:22px;height:22px}.badge{margin-left:auto;background:#e5e7eb;border-radius:999px;padding:3px 9px;font-size:13px}button,select{font-size:17px;padding:11px 13px;border-radius:11px;border:1px solid #d1d5db;background:white}button.primary{background:#111827;color:white;border:0;width:100%;font-weight:700}button.danger{color:#b91c1c}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.team{padding:12px;border-radius:12px;background:#f9fafb;margin:9px 0}.team h3{margin:0 0 8px}.muted{color:#6b7280;font-size:14px}#status{font-weight:600}</style></head><body><main>
<h1>⚽ Indoor Soccer 2026</h1><div class="sub">Oberschleißheim · Team-Ausloser</div><div class="card"><h2>Teilnehmer <span class="muted" id="selectedCount"></span></h2><div id="players"></div></div><div class="card"><div class="row"><label><b>Mannschaften:</b></label><select id="teamCount"><option>2</option><option selected>3</option><option>4</option></select></div><p class="muted">Die Auslosung berücksichtigt Gruppeneinteilung, Teamgröße und bereits gespeicherte Zusammensetzungen.</p><button class="primary" id="draw">Teams auslosen</button></div><div class="card" id="result" hidden><h2>Auslosung</h2><div id="teams"></div><button class="primary" id="save">Training speichern</button></div><div class="card"><h2>Historie</h2><p id="status"></p><button class="danger" id="clear">Historie löschen</button></div></main><script>
const PLAYERS=[{"id": "p0", "name": "Alexander Späth", "group": 1}, {"id": "p1", "name": "Andreas Hoffmann", "group": 1}, {"id": "p2", "name": "Carsten Wiechert", "group": 2}, {"id": "p3", "name": "Dirk Ruhs", "group": 2}, {"id": "p4", "name": "Franz Kohl", "group": 2}, {"id": "p5", "name": "Gerry Grass", "group": 2}, {"id": "p6", "name": "Joe Danner", "group": 1}, {"id": "p7", "name": "Johannes Schilling", "group": 1}, {"id": "p8", "name": "Kamel Silhadi", "group": 1}, {"id": "p9", "name": "Markus Jungwirth", "group": 1}, {"id": "p10", "name": "Michael Neuhofer", "group": 1}, {"id": "p11", "name": "MJ Wenger", "group": 1}, {"id": "p12", "name": "Olli Frank", "group": 1}, {"id": "p13", "name": "Peter Notheis", "group": 2}, {"id": "p14", "name": "Rainer Stasch", "group": 1}, {"id": "p15", "name": "Ralph (R.F.) Fischer", "group": 2}, {"id": "p16", "name": "Rolando Dannerbauer", "group": 2}, {"id": "p17", "name": "Rudi Brandl", "group": 1}, {"id": "p18", "name": "Sergio Ferraro", "group": 1}, {"id": "p19", "name": "Steffen Helmreich", "group": 1}, {"id": "p20", "name": "Tom (Tec Jet) Stegmaier", "group": 2}, {"id": "p21", "name": "Werner Klein", "group": 1}, {"id": "p22", "name": "ZZ Gast 1 Oliver", "group": 1}, {"id": "p23", "name": "ZZ Gast 2", "group": 2}, {"id": "p24", "name": "ZZ Gast 3", "group": 2}],KEY="indoor_soccer_pwa_v1";let currentTeams=null;
const history=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return []}};
function updateSelectedCount(){const n=document.querySelectorAll(".player input:checked").length;document.getElementById("selectedCount").textContent="("+n+" ausgewählt)"}function renderPlayers(){const el=document.getElementById("players");PLAYERS.forEach((p,i)=>{const d=document.createElement("label");d.className="player";const c=document.createElement("input");c.type="checkbox";c.dataset.id=p.id;c.checked=i<22;c.addEventListener("change",updateSelectedCount);d.append(c,document.createTextNode(p.name));const b=document.createElement("span");b.className="badge";b.textContent="Gruppe "+p.group;d.append(b);el.append(d)})}
function pairPenalty(ts){let s=0;for(const t of ts)for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++)for(const old of history())if(old.some(ot=>ot.includes(t[i].id)&&ot.includes(t[j].id)))s++;return s}
function quality(ts){const z=ts.map(t=>t.length),g=ts.map(t=>t.filter(p=>p.group===1).length);return pairPenalty(ts)*4+(Math.max(...z)-Math.min(...z))*100+(Math.max(...g)-Math.min(...g))*15}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function candidate(sel,n){const ts=Array.from({length:n},()=>[]);for(const g of [1,2])shuffle(sel.filter(p=>p.group===g)).forEach((p,i)=>ts[i%n].push(p));for(let k=0;k<20;k++){let b=ts.reduce((a,t,i)=>t.length>ts[a].length?i:a,0),s=ts.reduce((a,t,i)=>t.length<ts[a].length?i:a,0);if(ts[b].length-ts[s].length<=1)break;ts[s].push(ts[b].splice(Math.floor(Math.random()*ts[b].length),1)[0])}return ts}
function draw(){const ids=[...document.querySelectorAll(".player input:checked")].map(x=>x.dataset.id),sel=PLAYERS.filter(p=>ids.includes(p.id)),n=+teamCount.value;if(sel.length<n){alert("Bitte mindestens so viele Spieler auswählen wie Mannschaften.");return}let best=null,q=Infinity;for(let i=0;i<1400;i++){const t=candidate(sel,n),x=quality(t);if(x<q){best=t;q=x}}currentTeams=best;teams.innerHTML="";best.forEach((t,i)=>{const d=document.createElement("div");d.className="team";d.innerHTML="<h3>Team "+(i+1)+" – "+t.length+" Spieler</h3>"+t.map(p=>p.name+" <span class='muted'>(Gruppe "+p.group+")</span>").join("<br>");teams.append(d)});result.hidden=false}
function update(){status.textContent=history().length+" Training(s) gespeichert."}
document.getElementById("draw").onclick=draw;document.getElementById("save").onclick=()=>{if(!currentTeams)return;const h=history();h.push(currentTeams.map(t=>t.map(p=>p.id)));localStorage.setItem(KEY,JSON.stringify(h));update();alert("Training gespeichert.")};document.getElementById("clear").onclick=()=>{if(confirm("Gesamte Trainingshistorie wirklich löschen?")){localStorage.removeItem(KEY);update()}};
renderPlayers();updateSelectedCount();update();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
